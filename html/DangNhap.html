<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/dang-nhap.css">
</head>
<body class="font-sans antialiased">
  <main class="login-page">
    <div class="login-shell">
      <section class="mx-auto flex flex-col items-center text-center">
        <img class="brand-logo" src="../public/logocongan.png" alt="Logo Bộ Công an" />
        <h1 class="brand-title">CÔNG AN TỈNH NINH BÌNH</h1>
        <p class="brand-subtitle">HỆ THỐNG QUẢN LÝ CƠ SỞ KINH DOANH<br>CÓ ĐIỀU KIỆN VỀ ANTT</p>
      </section>

      <section class="login-card" aria-label="Đăng nhập tài khoản hệ thống">
        <div class="card-heading">
          <span class="heading-icon">
            <i data-lucide="user-round" class="h-8 w-8"></i>
          </span>
          <span>Đăng nhập tài khoản hệ thống</span>
        </div>

        <form action="QuanLyHoSo.html" method="get">
          <label class="field-group block">
            <span class="field-label">Tên đăng nhập / Số điện thoại / Email <span class="required">*</span></span>
            <span class="input-wrap block">
              <i data-lucide="user" class="input-icon"></i>
              <input class="login-input" type="text" placeholder="Nhập tên đăng nhập, số điện thoại hoặc email" />
            </span>
          </label>

          <label class="field-group block">
            <span class="field-label">Mật khẩu <span class="required">*</span></span>
            <span class="input-wrap block">
              <i data-lucide="lock-keyhole" class="input-icon"></i>
              <input class="login-input" type="password" placeholder="Nhập mật khẩu" />
              <button class="input-action" type="button" aria-label="Hiển thị mật khẩu">
                <i data-lucide="eye-off" class="h-[23px] w-[23px]"></i>
              </button>
            </span>
          </label>

          <div class="form-row">
            <label class="remember">
              <input type="checkbox" />
              <span>Ghi nhớ đăng nhập</span>
            </label>
            <a class="forgot-link" href="QuenMatKhau.html">Quên mật khẩu?</a>
          </div>

          <button class="primary-btn" type="submit">
            <i data-lucide="lock-keyhole" class="h-[26px] w-[26px]"></i>
            <span>Đăng nhập</span>
          </button>

          <div class="divider">Chưa có tài khoản?</div>

          <a class="secondary-btn" href="DangKy.html">
            <i data-lucide="user-round-plus" class="h-[27px] w-[27px]"></i>
            <span>Đăng ký tài khoản</span>
          </a>

          <div class="mt-6 text-center">
            <a href="../index.html" class="inline-flex items-center text-base font-semibold text-black hover:text-[#cf0000] transition-colors gap-2 justify-center">
              <i data-lucide="arrow-left" class="h-5 w-5"></i>
              <span>Cổng thông tin</span>
            </a>
          </div>
        </form>
      </section>
    </div>
  </main>
  <script src="../scripts/dang-nhap.js"></script>
</body>
</html>
