<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/dang-nhap.css">
  <style>
    /* ── FLOATING QUICK LOGIN STYLES ────────────────── */
    .quick-login-fab {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 999;
      background: linear-gradient(135deg, #df0008, #b70000);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 12px 24px;
      font-family: 'Roboto', sans-serif;
      font-weight: 600;
      font-size: 15px;
      box-shadow: 0 10px 25px rgba(223, 0, 8, 0.4);
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    
    .quick-login-fab:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 30px rgba(223, 0, 8, 0.5);
      background: linear-gradient(135deg, #f5000a, #d40000);
    }

    .quick-login-fab:active {
      transform: translateY(-1px);
    }

    .quick-login-drawer {
      position: fixed;
      right: 24px;
      bottom: 84px;
      width: 320px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(229, 233, 240, 0.8);
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(16, 23, 34, 0.15);
      z-index: 998;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transform: scale(0.9) translateY(20px);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
      transform-origin: bottom right;
    }

    .quick-login-drawer.open {
      transform: scale(1) translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-title {
      font-family: 'Roboto', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: #101722;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
      border-bottom: 2px solid #f3f4f6;
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .drawer-close {
      cursor: pointer;
      color: #7b8493;
      transition: color 0.15s ease;
    }

    .drawer-close:hover {
      color: #df0008;
    }

    .quick-acc-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 360px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .quick-acc-list::-webkit-scrollbar {
      width: 4px;
    }
    .quick-acc-list::-webkit-scrollbar-thumb {
      background: #e5e9f0;
      border-radius: 4px;
    }

    .quick-acc-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border: 1px solid #e5e9f0;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: left;
      width: 100%;
    }

    .quick-acc-item:hover {
      border-color: #df0008;
      background: #fff8f8;
    }

    .quick-acc-item.role-admin {
    }
    
    .quick-acc-item.role-user {
    }

    .acc-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      color: white;
      font-weight: 700;
      font-size: 13px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .acc-details {
      min-width: 0;
    }

    .acc-name {
      font-size: 13px;
      font-weight: 600;
      color: #101722;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .acc-desc {
      font-size: 11px;
      color: #7b8493;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    /* Error alert styled dynamically inside original layout */
    .login-alert-box {
      background: #fee2e2;
      border: 1px solid #fca5a5;
      color: #b91c1c;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 15px;
      display: none;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body class="font-sans antialiased">
  <main class="login-page">
    <div class="login-shell">
      <section class="mx-auto flex flex-col items-center text-center">
        <img class="brand-logo" src="../public/logocongan.png" alt="Logo Bộ Công an" />
        <h1 class="brand-title">CÔNG AN TỈNH NINH BÌNH</h1>
        <p class="brand-subtitle">HỆ THỐNG QUẢN LÝ CƠ SỞ KINH DOANH<br>CÓ ĐIỀU KIỆN VỀ ANTT</p>
      </section>

      <section class="login-card" aria-label="Đăng nhập tài khoản hệ thống">
        <div class="card-heading">
          <span class="heading-icon">
            <i data-lucide="user-round" class="h-8 w-8"></i>
          </span>
          <span>Đăng nhập tài khoản hệ thống</span>
        </div>

        <div class="login-alert-box" id="loginAlert">
          <i data-lucide="alert-circle" class="h-4 w-4"></i>
          <span id="loginAlertMsg">Sai tài khoản hoặc mật khẩu</span>
        </div>

        <form id="loginForm" action="QuanLyHoSo.html" method="get">
          <label class="field-group block">
            <span class="field-label">Tên đăng nhập / Số điện thoại / Email <span class="required">*</span></span>
            <span class="input-wrap block">
              <i data-lucide="user" class="input-icon"></i>
              <input class="login-input" type="text" id="usernameInput" placeholder="Nhập tên đăng nhập, số điện thoại hoặc email" />
            </span>
          </label>

          <label class="field-group block">
            <span class="field-label">Mật khẩu <span class="required">*</span></span>
            <span class="input-wrap block">
              <i data-lucide="lock-keyhole" class="input-icon"></i>
              <input class="login-input" type="password" id="passwordInput" placeholder="Nhập mật khẩu" />
              <button class="input-action" type="button" id="togglePassword" aria-label="Hiển thị mật khẩu">
                <i data-lucide="eye-off" class="h-[23px] w-[23px]"></i>
              </button>
            </span>
          </label>

          <div class="form-row">
            <label class="remember">
              <input type="checkbox" />
              <span>Ghi nhớ đăng nhập</span>
            </label>
            <a class="forgot-link" href="QuenMatKhau.html">Quên mật khẩu?</a>
          </div>

          <button class="primary-btn" type="submit">
            <i data-lucide="lock-keyhole" class="h-[26px] w-[26px]"></i>
            <span>Đăng nhập</span>
          </button>

          <div class="divider">Chưa có tài khoản?</div>

          <a class="secondary-btn" href="DangKy.html">
            <i data-lucide="user-round-plus" class="h-[27px] w-[27px]"></i>
            <span>Đăng ký tài khoản</span>
          </a>

          <div class="mt-6 text-center">
            <a href="../index.html" class="inline-flex items-center text-base font-semibold text-black hover:text-[#cf0000] transition-colors gap-2 justify-center">
              <i data-lucide="arrow-left" class="h-5 w-5"></i>
              <span>Cổng thông tin</span>
            </a>
          </div>
        </form>
      </section>
    </div>
  </main>

  <!-- Floating quick login button and menu -->
  <button class="quick-login-fab" id="quickLoginFab" type="button" aria-label="Mở bảng đăng nhập nhanh">
    <i data-lucide="key-round" class="h-5 w-5"></i>
    <span>Đăng nhập nhanh</span>
  </button>

  <div class="quick-login-drawer" id="quickLoginDrawer">
    <div class="drawer-title">
      <span>Tài khoản demo</span>
      <i data-lucide="x" class="drawer-close h-5 w-5" id="quickLoginClose"></i>
    </div>
    <div class="quick-acc-list" id="quickAccList">
      <!-- Populated dynamically -->
    </div>
  </div>

  <script src="../scripts/auth.js"></script>
  <script src="../scripts/dang-nhap.js"></script>
</body>
</html>
