<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng ký tài khoản</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/dang-ky.css">
</head>
<body class="font-sans antialiased">
  <main class="auth-page">
    <div class="auth-shell">
      <section class="mx-auto flex flex-col items-center text-center">
        <img class="brand-logo" src="../public/logocongan.png" alt="Logo Bộ Công an" />
        <h1 class="brand-title">CÔNG AN TỈNH NINH BÌNH</h1>
        <p class="brand-subtitle">HỆ THỐNG QUẢN LÝ CƠ SỞ KINH DOANH<br>CÓ ĐIỀU KIỆN VỀ ANTT</p>
      </section>

      <section class="auth-card" aria-label="Đăng ký tài khoản hệ thống">
        <div class="card-heading">
          <span class="heading-icon">
            <i data-lucide="user-round-plus" class="h-7 w-7"></i>
          </span>
          <span>Đăng ký tài khoản</span>
        </div>

        <form action="DangNhap.html" method="get">
          <div class="form-grid">
            <label>
              <span class="field-label">Họ và tên <span class="required">*</span></span>
              <span class="input-wrap">
                <i data-lucide="user" class="input-icon"></i>
                <input class="auth-input" type="text" placeholder="Nhập họ và tên" />
              </span>
            </label>

            <label>
              <span class="field-label">Số điện thoại <span class="required">*</span></span>
              <span class="input-wrap">
                <i data-lucide="phone" class="input-icon"></i>
                <input class="auth-input" type="tel" placeholder="Nhập số điện thoại" />
              </span>
            </label>

            <label>
              <span class="field-label">Email <span class="required">*</span></span>
              <span class="input-wrap">
                <i data-lucide="mail" class="input-icon"></i>
                <input class="auth-input" type="email" placeholder="Nhập email" />
              </span>
            </label>

            <label>
              <span class="field-label">Đơn vị công tác</span>
              <span class="input-wrap">
                <i data-lucide="building-2" class="input-icon"></i>
                <input class="auth-input" type="text" placeholder="Nhập đơn vị công tác" />
              </span>
            </label>

            <label>
              <span class="field-label">Mật khẩu <span class="required">*</span></span>
              <span class="input-wrap">
                <i data-lucide="lock-keyhole" class="input-icon"></i>
                <input class="auth-input" type="password" placeholder="Nhập mật khẩu" />
                <button class="input-action" type="button" aria-label="Hiển thị mật khẩu">
                  <i data-lucide="eye-off" class="h-[21px] w-[21px]"></i>
                </button>
              </span>
            </label>

            <label>
              <span class="field-label">Nhập lại mật khẩu <span class="required">*</span></span>
              <span class="input-wrap">
                <i data-lucide="shield-check" class="input-icon"></i>
                <input class="auth-input" type="password" placeholder="Nhập lại mật khẩu" />
                <button class="input-action" type="button" aria-label="Hiển thị mật khẩu">
                  <i data-lucide="eye-off" class="h-[21px] w-[21px]"></i>
                </button>
              </span>
            </label>
          </div>

          <label class="terms">
            <input type="checkbox" />
            <span>Tôi cam kết thông tin đăng ký là chính xác và chịu trách nhiệm về tài khoản được cấp.</span>
          </label>

          <button class="primary-btn" type="submit">
            <i data-lucide="user-round-plus" class="h-6 w-6"></i>
            <span>Đăng ký tài khoản</span>
          </button>

          <a class="secondary-btn" href="DangNhap.html">
            <i data-lucide="arrow-left" class="h-6 w-6"></i>
            <span>Quay lại đăng nhập</span>
          </a>
        </form>
      </section>
    </div>
  </main>
  <script src="../scripts/dang-ky.js"></script>
</body>
</html>
